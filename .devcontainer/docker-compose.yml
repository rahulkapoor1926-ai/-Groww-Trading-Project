# Fixed project name: the repo name starts with "-", which Docker Compose
# rejects as a project name, so Codespaces fell back to a recovery container.
name: groww-trading

# Codespaces runs two containers: the app (Python) and Postgres 16.
# The app shares Postgres's network, so the database is at localhost:5432.
services:
  app:
    image: mcr.microsoft.com/devcontainers/python:3.12
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    network_mode: service:db
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/trading
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: "5000"
      FLASK_DEBUG: "0"

  db:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trading

volumes:
  pgdata:
